name: Hestia cache GC

on:
  workflow_call:
    inputs:
      dry-run:
        description: Plan without changing or deleting cached data
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan without changing or deleting cached data
        type: boolean
        default: true

permissions: {}

concurrency:
  group: hestia-gc
  cancel-in-progress: false

jobs:
  gc:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.4
      - uses: x-ryoppippi/hestia@52d973d2cc564879d79c501e3c669eacd3e6d5dd # v3.1.0-x2
        with:
          version: v3.1.0-x2
          read-only: true
      - name: Collect unused cache data
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "$DRY_RUN" == true ]]; then
            "$HESTIA_BIN" gc --dry-run
          else
            "$HESTIA_BIN" gc
          fi
