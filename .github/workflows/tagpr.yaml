name: tagpr

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: tagpr
  cancel-in-progress: false

jobs:
  tagpr:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # tagpr's install.sh fetches its binary with one plain curl, and the
      # release CDN answers transient 504s; curl reads this file because
      # the script does not pass -q.
      - name: Retry transient download failures
        run: printf 'retry = 5\n' > "$HOME/.curlrc"
      - id: tagpr
        uses: Songmu/tagpr@047aec4b6c0ce166f52958b5a97f5a3d927fd65b # v1.22.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Pushes made with GITHUB_TOKEN start no workflows, so the release PR would never get
      # the check the main ruleset requires; workflow_dispatch is the event that token can start.
      - name: Run CI on the release pull request
        if: steps.tagpr.outputs.pull_request != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ fromJSON(steps.tagpr.outputs.pull_request).head.ref }}
        run: gh workflow run ci.yaml --ref "$BRANCH"
