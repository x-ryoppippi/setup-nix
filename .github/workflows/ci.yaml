name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  seed:
    name: Build (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix: &runners
        include:
          - id: github-linux
            runner: ubuntu-latest
            backend: hestia
          - id: github-macos
            runner: macos-latest
            backend: hestia
          - id: blacksmith-linux
            runner: blacksmith-4vcpu-ubuntu-2404
            backend: sticky
          - id: blacksmith-macos
            runner: blacksmith-12vcpu-macos-26
            backend: hestia
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./
        with:
          sticky-key: ${{ github.repository }}-e2e-${{ matrix.id }}
      - name: Verify selected backend and build
        env:
          EXPECTED: ${{ matrix.backend }}
          ACTUAL: ${{ steps.setup.outputs.backend }}
        run: |
          test "$ACTUAL" = "$EXPECTED"
          if [[ "$ACTUAL" == sticky ]]; then
            roots="/nix/var/nix/gcroots/per-user/$(id -un)/setup-nix-smoke"
            mkdir -p "$roots"
            out_link="$roots/result"
          else
            out_link=result
          fi
          nix build .#smoke --out-link "$out_link"
          "$out_link/bin/setup-nix-smoke"

  restore:
    name: Restore (${{ matrix.id }})
    needs: seed
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix: *runners
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./
        with:
          sticky-key: ${{ github.repository }}-e2e-${{ matrix.id }}
      - name: Verify cross-job cache reuse
        env:
          BACKEND: ${{ steps.setup.outputs.backend }}
        run: |
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          package="$(nix eval --raw ".#packages.$system.smoke.outPath")"
          if [[ "$BACKEND" == sticky ]]; then
            nix path-info "$package"
            nix build .#smoke --out-link "/nix/var/nix/gcroots/per-user/$(id -un)/setup-nix-smoke/result"
          else
            nix path-info --store "http://$HESTIA_LISTEN?trusted=true" "$package"
          fi
          nix run .#smoke

  no-init:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./
        with:
          cache: none
      - name: Verify a no-init runner
        env:
          BACKEND: ${{ steps.setup.outputs.backend }}
        run: |
          test "$BACKEND" = none
          nix run .#smoke

  gc-dry-run:
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/gc.yaml
    with:
      dry-run: true

  # The one check the main ruleset requires. `always()` makes it report even when a job
  # it needs fails, and a skipped job (restore off main) is not a failure.
  gate:
    needs: [seed, restore, no-init, gc-dry-run]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
